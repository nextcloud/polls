name: "CodeQL"

on:
  push:
    branches: [ "main", "master*", "next", "stable-*" ]
  pull_request:
    branches: [ "main", "master*", "next" ]
  schedule:
    - cron: '26 15 * * 4'

jobs:
  analyze:
    runs-on: ubuntu-latest

    name: Analyze

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 #4.39.1
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d #4.38.3
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d #4.38.3
