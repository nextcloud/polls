name: "CodeQL"

on:
  push:
    branches: [ "main", "master*", "next", "stable-*" ]
  pull_request:
    branches: [ "main", "master*", "next" ]
  schedule:
    - cron: '26 15 * * 4'

jobs:
  analyze:
    runs-on: ubuntu-latest

    name: Analyze

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd #4.38.1
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #4.38.0
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #4.38.0
